# Copy to inventory.ini and fill in the IPs from `terraform output`
[ubuntu]
Ubuntu_Server ansible_host=<ubuntu_public_ip> ansible_user=ubuntu

[rhel]
RHEL_Server ansible_host=<rhel_public_ip> ansible_user=ec2-user

[servers:children]
ubuntu
rhel

[servers:vars]
ansible_ssh_private_key_file=../terraform/d417-task2-key.pem
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_python_interpreter=/usr/bin/python3
